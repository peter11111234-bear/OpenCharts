<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>Pine Editor — OpenCharts</title>
<style>
  html,body{margin:0;height:100%;background:#1e222d;color:#d1d4dc;font:13px/1.4 sans-serif}
  #app{display:flex;flex-direction:column;height:100%}
  #bar{display:flex;align-items:center;gap:4px;padding:4px 8px;border-bottom:1px solid #2a2e39;background:#161a24;position:relative}
  #bar .name{color:#ddd;font-weight:600;padding:4px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;border-radius:4px;background:none;border:0;font-size:13px}
  #bar .name:hover{background:#2a2e39}
  button{background:none;border:0;color:#b2b5be;padding:4px 8px;font-size:13px;cursor:pointer;border-radius:4px;white-space:nowrap}
  button:hover{background:#2a2e39;color:#fff}
  button.primary{color:#2962ff}
  button.primary:hover{color:#4a80ff;background:#2a2e39}
  #dirty{color:#f0b90b;font-size:9px;visibility:hidden}
  #dirty.on{visibility:visible}
  #status{margin-left:auto;color:#8b8f9c;font-size:12px;padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #status[data-kind=ok]{color:#4caf7d}
  #status[data-kind=err]{color:#ef5350}
  #ed{flex:1;width:100%;resize:none;background:#161a24;color:#d5d8e0;border:0;outline:none;
      padding:10px 14px;font:13px/1.55 ui-monospace,Consolas,monospace;white-space:pre;tab-size:4}
  #foot{display:flex;align-items:center;gap:12px;padding:2px 10px;border-top:1px solid #2a2e39;color:#8b8f9c;font-size:12px}
  #menu{position:absolute;top:34px;left:8px;z-index:10;min-width:220px;max-height:70vh;overflow:auto;
      background:#1e222d;border:1px solid #363c4e;border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.5);padding:4px;display:none}
  #menu.open{display:block}
  #menu button{display:flex;width:100%;justify-content:space-between;gap:16px;padding:6px 10px;font-size:13px;text-align:left}
  #menu button:hover{background:#2a2e39;color:#fff}
  #menu .k{color:#6b7080;font-size:11px}
  #menu .head{padding:6px 10px 2px;color:#6b7080;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
  #menu .sep{height:1px;background:#2a2e39;margin:4px 6px}
  #sub{position:absolute;left:calc(100% - 4px);top:-4px;background:#1e222d;border:1px solid #363c4e;border-radius:6px;
      box-shadow:0 8px 24px rgba(0,0,0,.5);padding:4px;min-width:140px;display:none}
  #menu .parent{position:relative}
  #menu .parent.open #sub{display:block}
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button class="name" id="name" title="Script menu"><span id="nameLabel">Pine Editor</span><span id="dirty">●</span> ▾</button>
    <button id="btn-run" class="primary" title="Compile + add/update on chart">Add to chart</button>
    <button id="btn-save" title="Save to library (Ctrl+S)">Save</button>
    <button id="btn-reload" title="Reload script from library">↻</button>
    <button id="btn-clear" title="Clear the editor — paste fresh code">Clear</button>
    <span id="status"></span>
    <div id="menu"></div>
  </div>
  <textarea id="ed" spellcheck="false" placeholder="// paste Pine Script here"></textarea>
  <div id="foot"><span id="cursor">Line 1, Col 1</span><span>Pine Script v5/v6</span></div>
</div>
<script type="module" src="/src/pages/pineEditorWindow.ts"></script>
</body>
</html>
